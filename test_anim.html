<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Border</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 p-10">
    <div class="group relative p-[2px] rounded-2xl overflow-hidden shadow-sm transition-all hover:shadow-md block w-96 h-24">
        <!-- Animated border -->
        <div class="absolute inset-[-100%] bg-[conic-gradient(from_0deg_at_50%_50%,transparent_0%,transparent_70%,#3b82f6_100%)] animate-[spin_3s_linear_infinite]"></div>
        
        <!-- Inner content -->
        <div class="relative p-5 rounded-2xl bg-blue-50 dark:bg-blue-900/90 flex items-center justify-between h-full w-full">
            <span class="text-white">Content</span>
        </div>
    </div>
</body>
</html>
